<div class="compare">
  <div class="compare__grid">
    <section class="compare__side" [class]="'compare__side--' + leftTone()" [attr.aria-labelledby]="leftId">
      <h4 class="compare__title" [id]="leftId"><app-rich-text [text]="leftTitle()" /></h4>
      <div class="compare__body">
        <ng-content select="[left]" />
      </div>
    </section>

    <section class="compare__side" [class]="'compare__side--' + rightTone()" [attr.aria-labelledby]="rightId">
      <h4 class="compare__title" [id]="rightId"><app-rich-text [text]="rightTitle()" /></h4>
      <div class="compare__body">
        <ng-content select="[right]" />
      </div>
    </section>
  </div>

  @if (note()) {
    <p class="compare__note"><app-rich-text [text]="note()" /></p>
  }
</div>
