<div class="editor" [class.editor--ready]="ready()" [style.--editor-min-height]="minLines() * 1.6 + 1.7 + 'rem'">
  @if (!ready()) {
    <textarea
      #fallback
      class="editor__fallback"
      [attr.aria-label]="label()"
      [readOnly]="readonly()"
      [rows]="minLines()"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      [value]="code()"
      (input)="onFallbackInput($event)"
    ></textarea>
  }
  <!-- Always in the DOM so CodeMirror has somewhere to mount before it is shown. -->
  <div class="editor__host" #host [hidden]="!ready()"></div>
</div>
