<div class="cli-grid">
  <ul class="cli-tree">
    @for (f of files; track f.path) {
      <li>
        <button
          class="cli-row"
          [class.active]="selected().path === f.path"
          (click)="selected.set(f)">
          {{ f.label }}
        </button>
      </li>
    }
  </ul>
  <div class="cli-detail">
    <code>{{ selected().path }}</code>
    <p>{{ role() }}</p>
  </div>
</div>
